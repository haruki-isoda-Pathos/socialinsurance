<h2>ログイン</h2>

<form>

  <label>社員ID</label>
  <input type="employeeId" [(ngModel)]="employeeId" name="employeeId">

  <label>パスワード</label>
  <input type="password" [(ngModel)]="password" name="password">

  <button type="button" (click)="onsubmit()">
    ログイン
  </button>

  <label for ="backoff">アカウントを持っていない方はこちら</label>
  <button type="button" name="backoff" id="backoff" (click)="onBackOff()">
  登録画面へ
  </button>

</form>
