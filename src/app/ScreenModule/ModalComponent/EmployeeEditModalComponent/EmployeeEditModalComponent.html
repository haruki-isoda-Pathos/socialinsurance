<div class="modal">
    <div class="modal-content">
        <h2>従業員編集</h2>
        <form #f="ngForm" (ngSubmit)="onSubmit(f)">
            
            <label for="name">名前</label>
            <input type="text" id="name" name="name" placeholder="名前" [(ngModel)]="employee.name" required>

            <label for="employeeId">従業員ID</label>
            <p>{{employee.employeeId}}&ensp;(※変更不可)</p>

            <label for="birthdate">生年月日</label>
            <input type="date" id="birthdate" name="birthdate" [(ngModel)]="employee.birthdate" required>

            <label for="joindate">入社日</label>
            <input type="date" id="joindate" name="joindate" [(ngModel)]="employee.joindate" required>

            <label for="resigndate">退職予定日</label>
            <input type="date" id="resigndate" name="resigndate" [(ngModel)]="employee.resigndate">

            <label for="employmenttype">雇用形態</label>
              <span class="tooltip-container">
                <span class="tooltip-icon">?</span>
                <span class="tooltip-text">「正社員でない要件充足者」の「要件」とは、正社員規定労働時間の3/4以上働いていることをさす。また、特定適用事業所の短時間労働者とは、右に該当しなくても、51人以上の事業所で所定労働時間が週20時間以上、月収8.8万円以上の学生でない者、を指す。</span>
              </span>
            <select id="employmenttype" name="employmenttype" [(ngModel)]="employee.employmenttype" required>
              <option value="permanent">正社員</option>
              <option value="temporary">正社員でない要件充足者</option>
              <option value="short-term">特定適用事業所の短時間労働者</option>
              <option value="other">その他</option>
            </select>

            <label for="estincome">入社時見込み給付総額</label>
            <input type="number" id="estincome" name="estincome" [(ngModel)]="employee.estincome" required>

            <label for="dependents">被扶養者（第三号被保険者）の該当</label>
            <select id="dependents" name="dependents" [(ngModel)]="employee.dependents" required>
              <option value="yes">該当</option>
              <option value="no">該当しない</option>
            </select>

            <label for="status">ステータス</label>
            <select id="status" name="status" [(ngModel)]="employee.status" required>
              <option value="b-join">入社前</option>
              <option value="active1">従事中</option>
              <option value="active2">従事中（養育期間特例適用中）</option>
              <option value="resigning">退職予定</option>
              <option value="resigned">退職</option>
              <option value="inactive">休職</option>
              <option value="inactive1">特別休職(育休)</option>
              <option value="inactive2">特別休職(産休)</option>
              <option value="inactive3">特別休職(育休+産休)</option>
            </select>

            <label for="applicabledate">上記内容の適用開始年月日</label>
            <input type="date" id="applicabledate" name="applicabledate" [(ngModel)]="employee.applicabledate" required>

            <button type="submit">編集完了</button>
            <button type="button" (click)="onClose()">キャンセル</button>
        </form>
    </div>
</div>
