<div class="modal">
    <div class="modal-content">
        <h2>支給実績登録/編集</h2>
        <p>{{ employee.name }}&nbsp;さん</p>
        <p>※該当年月の情報/支給分を登録してください。</p>
        <form #f="ngForm" (ngSubmit)="onSubmit(f)">
            <label for="year-month">該当年月</label>
            <input type="month" id="year-month" name="year-month" [(ngModel)]="payment.yearMonth" required>
            
            <label for="networkday">出勤日数計(本業)</label>
            <input type="number" id="networkday" name="networkday" [(ngModel)]="payment.networkDay" required>

            <label for="fixedPay">
                固定的給与計（本業）※半角数字のみ入力
                <span class="tooltip-container">
                    <span class="tooltip-icon">?</span>
                    <span class="tooltip-text">健保法43条、健保則4条、厚年法23条、昭和36年通達による、固定的賃金に含まれる支給項目の総計。(残業手当、休日出勤手当、精勤手当、歩合給など)</span>
                </span>
            </label>
            <input type="number" id="fixedPay" name="fixedPay" [(ngModel)]="payment.fixedPay" required>

            <label for="currentPay">
                非固定的給与計（本業）※半角数字のみ入力
                <span class="tooltip-container">
                    <span class="tooltip-icon">?</span>
                    <span class="tooltip-text">健保法43条、健保則4条、厚年法23条、昭和36年通達による、固定的賃金に含まれない支給項目の総計。(基本給、就業規則上の役職手当、固定残業代など)</span>
                </span>
            </label>
            <input type="number" id="currentPay" name="currentPay" [(ngModel)]="payment.currentPay" required>

            <div class="checkbox-container">
                <input type="checkbox" id="sidejobincome" name="sidejobincome" [(ngModel)]="payment.sidejobincome">
                <label for="sidejobincome">
                    副業の有無
                    <span class="tooltip-container">
                        <span class="tooltip-icon">?</span>
                        <span class="tooltip-text">副業の有無は、副業に従事しているか、でなく、副業先で社会保険の対象となっているかである。社会保険の対象となる者は、正社員、正社員の規定労働時間の3/4以上働いている者、そのほか51人以上の事業所で所定労働時間が週20時間以上、月収8.8万円以上の学生でない者である。</span>
                    </span>
                </label>
            </div>

            <ng-container *ngIf="payment.sidejobincome">
                <label for="sideJobNetworkDay">出勤日数計(副業)</label>
                <input type="number" id="sideJobNetworkDay" name="sideJobNetworkDay" [(ngModel)]="payment.sideJobNetworkDay" [required]="payment.sidejobincome">

                <label for="sideJobFixedPay">
                    固定的給与計（副業）※半角数字のみ入力
                    <span class="tooltip-container">
                        <span class="tooltip-icon">?</span>
                        <span class="tooltip-text">健保法43条、健保則4条、厚年法23条、昭和36年通達による、固定的賃金に含まれる支給項目の総計。(残業手当、休日出勤手当、精勤手当、歩合給など)</span>
                    </span>
                </label>
                <input type="number" id="sideJobFixedPay" name="sideJobFixedPay" [(ngModel)]="payment.sideJobFixedPay" [required]="payment.sidejobincome">

                <label for="sideJobCurrentPay">
                    非固定的給与計（副業）※半角数字のみ入力
                    <span class="tooltip-container">
                        <span class="tooltip-icon">?</span>
                        <span class="tooltip-text">健保法43条、健保則4条、厚年法23条、昭和36年通達による、固定的賃金に含まれない支給項目の総計。(基本給、就業規則上の役職手当、固定残業代など)</span>
                    </span>
                </label>
                <input type="number" id="sideJobCurrentPay" name="sideJobCurrentPay" [(ngModel)]="payment.sideJobCurrentPay" [required]="payment.sidejobincome">
            </ng-container>
        
            <button type="submit">登録</button>
            <button type="button" (click)="onClose()">キャンセル</button>
        </form>
    </div>
</div>
