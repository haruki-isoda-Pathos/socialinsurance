<div class="net-insurance-menu">
    <h2>保険料総額照会</h2>
    <div class="form-container">
    <form>
        <label for="yearMonth">該当年月</label>
        <input type="month" id="yearMonth" name="yearMonth" [(ngModel)]="yearMonth">

        <button type="submit" (click)="onReference()">指定年月分の保険料を照会</button>
    </form>
    </div>
    <div class="result">
        <p>健康保険料: 100<!--{{ healthInsurancePremium }}-->円/内会社負担分</p>
        <p>介護保険料: 100<!--{{ termCareInsurancePremium }}-->円/内会社負担分</p>
        <p>厚生年金保険料: 100<!--{{ socialInsurancePremium }}-->円/内会社負担分</p>
    </div>
</div>
