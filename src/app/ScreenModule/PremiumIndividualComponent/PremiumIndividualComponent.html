<div class="container">
    <h2>従業員別保険料照会</h2>
    <div class="form-container">
    <form>
        <label for="employeeId">従業員ID(メールアドレス)</label>
        <input type="text" id="employeeId" name="employeeId" [(ngModel)]="employeeId">

        <label for="yearMonth">該当年月</label>
        <input type="month" id="yearMonth" name="yearMonth" [(ngModel)]="yearMonth">

        <button type="submit" (click)="onReference()">指定年月分の保険料を照会</button>
    </form>
    </div>
    <div class="result">
        <p>健康保険料: 100<!--{{ healthInsurancePremiumIndividual }}-->円/内会社負担分</p>
        <p>介護保険料: 100<!--{{ termCareInsurancePremiumIndividual }}-->円/内会社負担分</p>
        <p>厚生年金保険料: 100<!--{{ socialInsurancePremiumIndividual }}-->円/内会社負担分</p>
        <p>備考:<!--{{ remarks }}--></p>
    </div>
</div>
